[project]
name = "mini-connected-estate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai", email = "saijaswanthcivil@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.63.0",
    "ifcopenshell>=0.9.0.post1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "reportlab>=5.1.0",
]

[project.scripts]
mini-connected-estate = "mini_connected_estate:main"

[build-system]
